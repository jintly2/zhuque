<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朱雀回测系统 · 15分钟趋势回测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--border:#2d333b;
  --text:#e6edf3;--text2:#9aa4b2;--text3:#6e7681;
  --up:#ff5c5c;--down:#39d353;--accent:#7ab3ff;--warn:#e6c45c;
  --mono:'SF Mono',Consolas,'Courier New',monospace;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
/* ===== 顶部 ===== */
.header{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;flex-wrap:wrap}
.back{color:var(--accent);text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);transition:.2s}
.back:hover{background:var(--accent);color:#0d1117}
.h-title{font-size:17px;font-weight:800;letter-spacing:1px}
.h-title span{color:var(--text3);font-size:12px;font-weight:400;margin-left:8px}
.hdr-spacer{flex:1}
.hdr-badge{font-size:11px;padding:4px 10px;border-radius:12px;background:rgba(57,211,83,.12);color:var(--down);border:1px solid rgba(57,211,83,.4)}
/* ===== 参数面板 ===== */
.cfg{margin-top:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.cfg-item{display:flex;flex-direction:column;gap:5px}
.cfg-item label{font-size:11px;color:var(--text3)}
.cfg-item select,.cfg-item input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;outline:none;font-family:var(--mono)}
.cfg-item select:focus,.cfg-item input:focus{border-color:var(--accent)}
.cfg-item .chk{display:flex;align-items:center;gap:6px;padding:8px 0;font-size:12.5px;color:var(--text2);cursor:pointer}
.cfg-item .chk input{accent-color:var(--accent)}
.btn-run{background:linear-gradient(135deg,#ff7a18,#ff4d2e);color:#fff;border:none;border-radius:8px;padding:9px 26px;font-size:14px;font-weight:700;cursor:pointer;transition:.25s;box-shadow:0 4px 18px rgba(255,74,46,.35)}
.btn-run:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(255,74,46,.5)}
.btn-run:disabled{opacity:.5;cursor:wait}
#status{margin-top:10px;font-size:12px;color:var(--warn);min-height:16px}
/* ===== 统计卡片 ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.kpi .k{font-size:11px;color:var(--text3);margin-bottom:5px}
.kpi .v{font-size:18px;font-weight:800;font-family:var(--mono)}
.kpi .v.up{color:var(--up)}.kpi .v.down{color:var(--down)}.kpi .v.warn{color:var(--warn)}
.kpi .sub{font-size:10.5px;color:var(--text3);margin-top:4px}
/* ===== 面板 ===== */
.panel{margin-top:12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.panel h3{font-size:13.5px;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.panel h3::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px}
canvas{width:100%;height:320px;display:block;background:var(--panel2);border-radius:8px}
.legend{display:flex;gap:16px;font-size:11px;color:var(--text3);margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:16px;height:3px;border-radius:2px;display:inline-block}
/* ===== 表格 ===== */
.tbl-wrap{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--text3);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel)}
td{text-align:right;padding:6px 8px;font-family:var(--mono);border-bottom:1px solid #21262d}
th:first-child,td:first-child{text-align:left}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--text2)}
tr:hover td{background:rgba(122,179,255,.04)}
/* ===== 规则说明 ===== */
.rule{margin-top:12px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--text2);line-height:1.9}
.rule b{color:var(--accent)}
.foot{text-align:center;color:var(--text3);font-size:11px;margin:16px 0 10px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <a class="back" href="index.html">← 返回主页</a>
    <div class="h-title">朱雀回测系统<span>15分钟趋势策略 · 历史回测与参数调优</span></div>
    <div class="hdr-spacer"></div>
    <div class="hdr-badge" id="dataRange">数据范围 --</div>
  </div>
  <div class="cfg">
    <div class="cfg-item">
      <label>周期</label>
      <select id="period">
        <option value="15m">15分钟</option>
        <option value="30m">30分钟</option>
        <option value="60m">60分钟</option>
      </select>
    </div>
    <div class="cfg-item">
      <label>均线模式</label>
      <select id="maType">
        <option value="single">单均线</option>
        <option value="dual">双均线</option>
      </select>
    </div>
    <div class="cfg-item">
      <label>MA1</label>
      <input type="number" id="ma1" value="60" min="5" max="500">
    </div>
    <div class="cfg-item" id="ma2Wrap">
      <label>MA2</label>
      <input type="number" id="ma2" value="160" min="5" max="500">
    </div>
    <div class="cfg-item">
      <label>&nbsp;</label>
      <label class="chk"><input type="checkbox" id="useMacd" checked> MACD金叉过滤</label>
    </div>
    <div class="cfg-item">
      <label>&nbsp;</label>
      <label class="chk"><input type="checkbox" id="useD1" checked> 日线MA10过滤</label>
    </div>
    <div class="cfg-item">
      <label>固定仓位(万/笔)</label>
      <input type="number" id="fixed" value="100" min="1" max="10000">
    </div>
    <button class="btn-run" id="runBtn" onclick="doRun()">开始回测</button>
  </div>
  <div id="status">加载历史数据中…</div>
  <div class="cards" id="cards"></div>
  <div class="panel">
    <h3>累计收益曲线（策略 vs 买入持有）</h3>
    <canvas id="eqCurve"></canvas>
    <div class="legend">
      <span><i class="dot" style="background:var(--up)"></i>策略累计盈亏（固定每笔）</span>
      <span><i class="dot" style="background:var(--down)"></i>同期买入持有</span>
      <span><i class="dot" style="background:var(--text3)"></i>持仓区间</span>
    </div>
  </div>
  <div class="panel">
    <h3>分年度统计</h3>
    <div class="tbl-wrap"><table id="yearTable"></table></div>
  </div>
  <div class="panel">
    <h3>交易明细</h3>
    <div class="tbl-wrap"><table id="tradeTable"></table></div>
  </div>
  <div class="rule">
    <b>策略规则：</b>入场＝收盘价站上均线（双均线为同时站上MA1与MA2）＋ 勾选MACD金叉态 ＋ 勾选日线前一交易日收盘&gt;MA10；出场＝反向完全满足（收盘跌破均线 ＋ 对应过滤反向）。固定每笔100万、只做多、不复利，手续费0.025%＋滑点0.01%。
  </div>
  <div class="foot">数据来源：历史K线CSV · 仅供研究参考，不构成投资建议</div>
</div>
<script>
// ================= 配置 =================
const DATA={
  '15m':'data/510500_15m_full.csv',
  '30m':'data/510500_30m_full.csv',
  '60m':'data/510500_60m_full.csv'
};
const D1CSV='data/510500_240m_full.csv';
const FEE=0.00025,SLIP=0.0001;
// ================= 工具函数 =================
function fmtDT(t){
  if(!t)return '--';
  if(t.length===10)return t.slice(0,4)+'-'+t.slice(5,7)+'-'+t.slice(8,10);
  return t.slice(0,16).replace('T',' ');
}
function calcMA(arr,p){
  const r=[];
  for(let i=0;i<arr.length;i++){
    if(i<p-1){r.push(null);continue}
    let s=0;for(let j=i-p+1;j<=i;j++)s+=arr[j];
    r.push(s/p);
  }
  return r;
}
function calcEMA(arr,p){
  const k=2/(p+1);const r=[];let prev=arr[0];
  for(let i=0;i<arr.length;i++){prev=i===0?arr[0]:arr[i]*k+prev*(1-k);r.push(prev)}
  return r;
}
function calcMACD(closes){
  const e12=calcEMA(closes,12),e26=calcEMA(closes,26);
  const dif=closes.map((_,i)=>e12[i]-e26[i]);
  const dea=calcEMA(dif,9);
  return {dif,dea};
}
function bisectLeft(arr,val){
  let lo=0,hi=arr.length;
  while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<val)lo=m+1;else hi=m}
  return lo;
}
// ================= 数据加载 =================
async function loadCSV(path){
  const res=await fetch(path);
  const text=await res.text();
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const p=lines[i].split(',');
    if(p.length<6)continue;
    rows.push({datetime:p[0].trim(),open:+p[1],high:+p[2],low:+p[3],close:+p[4],volume:+p[5]});
  }
  return rows;
}
// 日线对齐：对每根主周期K线取"前一交易日"日线索引
function alignPrev(d1ts,mts){
  const idx=[];
  for(const mt of mts){
    const pos=bisectLeft(d1ts,mt)-1;
    idx.push(pos>=0?pos:-1);
  }
  return idx;
}
// ================= 回测引擎 =================
function runBacktest(main,d1,opts){
  const {ma1,ma2,useDual,useMacd,useD1,fixed}=opts;
  const n=main.length;
  const close=main.map(k=>k.close);
  const maA=calcMA(close,ma1);
  const maB=useDual?calcMA(close,ma2):null;
  const {dif,dea}=calcMACD(close);
  const golden=dif.map((d,i)=>d>dea[i]);
  // 日线MA10对齐
  let d1Above=null,d1Below=null;
  if(useD1){
    const d1c=d1.map(k=>k.close);
    const d1ma10=calcMA(d1c,10);
    const above=d1c.map((c,i)=>d1ma10[i]==null?null:c>d1ma10[i]);
    const below=d1c.map((c,i)=>d1ma10[i]==null?null:c<d1ma10[i]);
    const d1ts=d1.map(k=>Date.parse(k.datetime.slice(0,10)));
    const mts=main.map(k=>Date.parse(k.datetime.slice(0,10)));
    const idx=alignPrev(d1ts,mts);
    d1Above=idx.map(pi=>pi>=0?above[pi]:null);
    d1Below=idx.map(pi=>pi>=0?below[pi]:null);
  }
  // 入场/出场信号
  const enter=close.map((c,i)=>{
    if(maA[i]==null)return false;
    let e=c>maA[i];
    if(useDual){if(maB[i]==null)return false;e=e&&c>maB[i]}
    if(useMacd)e=e&&golden[i];
    if(useD1)e=e&&(d1Above[i]===true);
    return e;
  });
  const exit=close.map((c,i)=>{
    if(maA[i]==null)return false;
    let e=c<maA[i];
    if(useDual){if(maB[i]==null)return false;e=e&&c<maB[i]}
    if(useMacd)e=e&&!golden[i];
    if(useD1)e=e&&(d1Below[i]===true);
    return e;
  });
  // 交易循环（从ma1起，确保有MA）
  let pos=0,eidx=0,eprice=0;
  const trades=[];
  const holdFlag=new Array(n).fill(0);
  for(let i=opts.start;i<n;i++){
    const c=close[i];
    if(pos&&exit[i]){
      const sp=c*(1-SLIP);
      const ret=sp*(1-FEE)/(eprice*(1+FEE))-1;
      trades.push({inTime:main[eidx].datetime,outTime:main[i].datetime,
        inPrice:+eprice.toFixed(4),outPrice:+sp.toFixed(4),
        bars:i-eidx,pnlPct:ret*100,pnlY:Math.round(fixed*ret),hold:holdFlag.slice(eidx,i)});
      pos=0;
    }
    if(!pos&&enter[i]){
      eprice=c*(1+SLIP);eidx=i;pos=1;
    }
    if(pos)holdFlag[i]=1;
  }
  return {trades,holdFlag};
}
// ================= 统计 =================
function summarize(trades,main,firstClose,fixed){
  const nt=trades.length;
  const wins=trades.filter(t=>t.pnlPct>0);
  const losses=trades.filter(t=>t.pnlPct<=0);
  const totalY=trades.reduce((s,t)=>s+t.pnlY,0);
  const totalPct=totalY/fixed*100;
  let streak=0,cur=0;
  for(const t of trades){if(t.pnlPct<0){cur++;streak=Math.max(streak,cur)}else cur=0}
  // 买入持有
  const buyHold=(main[main.length-1].close/firstClose-1)*100;
  // 每年
  const years={};
  for(const t of trades){
    const y=t.outTime.slice(0,4);
    if(!years[y])years[y]={n:0,w:0,l:0,pnl:0,maxW:0,maxL:0};
    const yr=years[y];
    yr.n++;yr.pnl+=t.pnlY;
    if(t.pnlPct>0){yr.w++;yr.maxW=Math.max(yr.maxW,t.pnlY)}
    else{yr.l++;yr.maxL=Math.min(yr.maxL,t.pnlY)}
  }
  return {
    nt,winN:wins.length,winRate:nt?wins.length/nt*100:0,
    totalY,totalPct,
    avgWin:wins.length?wins.reduce((s,t)=>s+t.pnlPct,0)/wins.length:0,
    avgLoss:losses.length?losses.reduce((s,t)=>s+t.pnlPct,0)/losses.length:0,
    avgBars:trades.length?trades.reduce((s,t)=>s+t.bars,0)/trades.length:0,
    streak,
    maxW:trades.length?Math.max(...trades.map(t=>t.pnlY)):0,
    maxL:trades.length?Math.min(...trades.map(t=>t.pnlY)):0,
    buyHold,years
  };
}
// ================= 渲染 =================
function renderCards(st,opt){
  const c=$('cards');c.innerHTML='';
  const items=[
    ['回测区间',opt.range,''],
    ['交易笔数',st.nt,'只做多'],
    ['胜率',st.nt?st.winRate.toFixed(1)+'%':'--',''],
    ['累计盈亏',(st.totalY>=0?'+':'')+st.totalY.toLocaleString()+'元',st.totalY>0?'up':st.totalY<0?'down':'flat'],
    ['收益率',(st.totalPct>=0?'+':'')+st.totalPct.toFixed(1)+'%','以100万本金'],
    ['同期买入持有',(st.buyHold>=0?'+':'')+st.buyHold.toFixed(1)+'%',st.buyHold>0?'up':'down'],
    ['平均盈利',st.avgWin?'+'+st.avgWin.toFixed(2)+'%':'--','up'],
    ['平均亏损',st.avgLoss?st.avgLoss.toFixed(2)+'%':'--','down'],
    ['平均持仓',st.avgBars?st.avgBars.toFixed(0)+'根':'-',''],
    ['最大连亏',st.streak+'次','warn'],
    ['最大单笔盈利',(st.maxW>=0?'+':'')+st.maxW.toLocaleString()+'元','up'],
    ['最大单笔亏损',(st.maxL<=0?'':'+')+st.maxL.toLocaleString()+'元','down']
  ];
  for(const [k,v,cls] of items){
    const d=document.createElement('div');d.className='kpi';
    d.innerHTML=`<div class="k">${k}</div><div class="v ${cls}">${v}</div>`;
    c.appendChild(d);
  }
}
function renderCurve(main,trades,holdFlag){
  const cv=$('eqCurve'),ctx=cv.getContext('2d');
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W;cv.height=H;
  const n=main.length;
  const firstClose=main[0].close;
  // 构建逐K线累计盈亏：持仓按浮动，平仓累加
  const stratCum=new Array(n).fill(0);
  let cum=0,ti=0;
  for(let i=0;i<n;i++){
    if(ti<trades.length&&trades[ti].outTime===main[i].datetime){cum+=trades[ti].pnlY;ti++}
    // 显示已平仓累计
    stratCum[i]=cum;
  }
  const bh=main.map(k=>1000000*(k.close/firstClose-1));
  const all=[...stratCum,...bh];
  let lo=Math.min(...all),hi=Math.max(...all);
  const pad=(hi-lo)*0.08;lo-=pad;hi+=pad;
  const top=10,bottom=H-10,ch=bottom-top;
  const X=i=>i/(n-1)*W;
  const Y=v=>top+(hi-v)/(hi-lo)*ch;
  ctx.clearRect(0,0,W,H);
  // 网格
  ctx.strokeStyle='#21262d';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=top+ch*i/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // 持仓区间背景
  let hStart=-1;
  for(let i=0;i<n;i++){
    if(holdFlag[i]&&hStart<0)hStart=i;
    if(!holdFlag[i]&&hStart>=0){fillHold(hStart,i);hStart=-1}
  }
  if(hStart>=0)fillHold(hStart,n);
  function fillHold(a,b){
    ctx.fillStyle='rgba(255,122,24,.05)';
    ctx.fillRect(X(a),top,X(b)-X(a),ch);
  }
  // 基准线
  ctx.strokeStyle='rgba(57,211,83,.8)';ctx.lineWidth=1.4;ctx.beginPath();
  for(let i=0;i<n;i++){const x=X(i),y=Y(bh[i]);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  ctx.stroke();
  // 策略线
  ctx.strokeStyle='#ff5c5c';ctx.lineWidth=1.8;ctx.beginPath();
  for(let i=0;i<n;i++){const x=X(i),y=Y(stratCum[i]);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  ctx.stroke();
  // 零轴
  const y0=Y(0);
  ctx.strokeStyle='rgba(230,237,243,.25)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();ctx.setLineDash([]);
  // 首末标注
  const step=Math.max(1,Math.floor(n/8));
  ctx.fillStyle='#6e7681';ctx.font='10px monospace';ctx.textAlign='center';
  for(let i=0;i<n;i+=step){
    ctx.fillText(main[i].datetime.slice(0,10),X(i),H-2);
  }
  // 数值标注
  ctx.fillStyle='rgba(255,92,92,.9)';ctx.textAlign='left';
  ctx.fillText('策略 '+(stratCum[n-1]>=0?'+':'')+stratCum[n-1].toLocaleString()+'元',8,top+12);
  ctx.fillStyle='rgba(57,211,83,.9)';
  ctx.fillText('持有 '+(bh[n-1]>=0?'+':'')+bh[n-1].toLocaleString()+'元',8,top+26);
}
function renderYearTable(st){
  const tb=$('yearTable');
  let h='<thead><tr><th>年份</th><th>笔数</th><th>盈利笔</th><th>亏损笔</th><th>盈亏额(元)</th><th>最大单笔盈</th><th>最大单笔亏</th></tr></thead><tbody>';
  const years=Object.keys(st.years).sort();
  if(!years.length){h+='<tr><td colspan="7" style="text-align:center;color:var(--text3)">无交易</td></tr>' }
  for(const y of years){
    const yr=st.years[y];
    const cls=yr.pnl>0?'up':yr.pnl<0?'down':'flat';
    h+=`<tr><td>${y}</td><td>${yr.n}</td><td class="up">${yr.w}</td><td class="down">${yr.l}</td>
      <td class="${cls}">${yr.pnl>0?'+':''}${yr.pnl.toLocaleString()}</td>
      <td class="up">+${yr.maxW.toLocaleString()}</td><td class="down">${yr.maxL.toLocaleString()}</td></tr>`;
  }
  h+='</tbody>';
  tb.innerHTML=h;
}
function renderTradeTable(trades){
  const tb=$('tradeTable');
  let h='<thead><tr><th>#</th><th>入场时间</th><th>出场时间</th><th>入场价</th><th>出场价</th><th>持仓(根)</th><th>盈亏%</th><th>盈亏(元)</th></tr></thead><tbody>';
  if(!trades.length){h+='<tr><td colspan="8" style="text-align:center;color:var(--text3)">无交易</td></tr>'}
  trades.forEach((t,i)=>{
    const cls=t.pnlPct>0?'up':t.pnlPct<0?'down':'flat';
    h+=`<tr><td>${i+1}</td><td>${fmtDT(t.inTime)}</td><td>${fmtDT(t.outTime)}</td>
      <td>${(+t.inPrice).toFixed(3)}</td><td>${(+t.outPrice).toFixed(3)}</td><td>${t.bars}</td>
      <td class="${cls}">${t.pnlPct>0?'+':''}${t.pnlPct.toFixed(2)}%</td>
      <td class="${cls}">${t.pnlY>0?'+':''}${t.pnlY.toLocaleString()}</td></tr>`;
  });
  h+='</tbody>';
  tb.innerHTML=h;
}
// ================= 主流程 =================
const $=id=>document.getElementById(id);
let MAIN=null,D1=null;
$('maType').addEventListener('change',()=>{
  $('ma2Wrap').style.opacity=$('maType').value==='dual'?1:.35;
});
$('period').addEventListener('change',async()=>{
  await loadPeriod();
});
async function loadPeriod(){
  const p=$('period').value;
  $('status').textContent='加载'+p+'数据…';
  try{
    const main=await loadCSV(DATA[p]);
    MAIN=main;
    const first=fmtDT(main[0].datetime).slice(0,10),last=fmtDT(main[main.length-1].datetime).slice(0,10);
    $('dataRange').textContent='数据 '+first+' ~ '+last+' · '+main.length+'根';
    $('status').textContent='数据就绪，回测中…';
    doRun();
  }catch(e){$('status').textContent='数据加载失败：'+e.message}
}
async function doRun(){
  const btn=$('runBtn');btn.disabled=true;
  $('status').textContent='回测计算中…';
  const ma1v=+$('ma1').value,ma2v=+$('ma2').value;
  const useDual=$('maType').value==='dual';
  const opts={
    period:$('period').value,
    ma1:ma1v,
    ma2:ma2v,
    useDual,
    useMacd:$('useMacd').checked,
    useD1:$('useD1').checked,
    fixed:(+$('fixed').value)*10000,
    start:useDual?Math.max(ma1v,ma2v):ma1v
  };
  await sleep(20);
  const {trades,holdFlag}=runBacktest(MAIN,D1,opts);
  const firstClose=MAIN[0].close;
  const st=summarize(trades,MAIN,firstClose,opts.fixed);
  st.nt=trades.length; // 重新算（summarize里已有）
  const first=fmtDT(MAIN[0].datetime).slice(0,10),last=fmtDT(MAIN[MAIN.length-1].datetime).slice(0,10);
  opts.range=first+' ~ '+last;
  renderCards(st,opts);
  renderCurve(MAIN,trades,holdFlag);
  renderYearTable(st);
  renderTradeTable(trades);
  $('status').textContent=`回测完成：${trades.length}笔 · 区间 ${opts.range}`;
  btn.disabled=false;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// ================= 初始化 =================
async function init(){
  try{
    $('status').textContent='加载主周期数据…';
    const main=await loadCSV(DATA[$('period').value]);
    $('status').textContent='加载日线数据…';
    const d1=await loadCSV(D1CSV);
    MAIN=main;D1=d1;
    const first=fmtDT(main[0].datetime).slice(0,10),last=fmtDT(main[main.length-1].datetime).slice(0,10);
    $('dataRange').textContent='数据 '+first+' ~ '+last+' · '+main.length+'根';
    $('status').textContent='数据就绪，点击"开始回测"';
    doRun();
  }catch(e){
    $('status').textContent='数据加载失败：'+e.message;
  }
}
init();
</script>
